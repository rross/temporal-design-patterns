<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Two identical requests sharing the same idempotency key (red dot) -->
  <rect x="4" y="14" width="24" height="16" rx="3" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="11" cy="22" r="3" fill="#cc2222"/>

  <rect x="4" y="50" width="24" height="16" rx="3" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="11" cy="58" r="3" fill="#cc2222"/>

  <!-- Converging into the dedup gate -->
  <line x1="28" y1="22" x2="46" y2="36" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="58" x2="46" y2="44" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dedup gate (collapses duplicates to one) -->
  <rect x="46" y="30" width="16" height="20" rx="3" fill="none" stroke="#cc2222" stroke-width="2"/>

  <!-- Single committed output -->
  <line x1="62" y1="40" x2="78" y2="40" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <polygon points="76,37 84,40 76,43" fill="#888"/>

  <!-- Committed once (check) -->
  <circle cx="90" cy="40" r="8" fill="none" stroke="#888" stroke-width="1.5"/>
  <polyline points="86,40 89,43 94,37" fill="none" stroke="#cc2222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
